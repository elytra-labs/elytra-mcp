name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build console and site
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install '.[dev,cloud]' build
      - name: Tests
        run: python -m pytest tests -q
      - name: Implementation checks
        run: python scripts/qa_gate.py
      - name: Build package
        run: python -m build --wheel
      - name: Verify the installed wheel away from the source tree
        shell: bash
        run: |
          python -m venv /tmp/elytra-release-venv
          /tmp/elytra-release-venv/bin/python -m pip install dist/*.whl
          cp scripts/verify_installed_release.py /tmp/verify_elytra_release.py
          cd /tmp
          /tmp/elytra-release-venv/bin/python -I /tmp/verify_elytra_release.py
